spring:
  application:
    name: empilot

    # API versioning
  mvc:
    apiversion:
      use:
        header: API-Version

  datasource:
    url: jdbc:mariadb://localhost:3307/empilot
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
