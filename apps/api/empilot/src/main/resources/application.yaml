spring:
  application:
    name: empilot

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:apps/api/empilot/.env[.properties]

    # API versioning
  mvc:
    apiversion:
      default: "1.0"
      use:
        header: API-Version 

  datasource:
    url: jdbc:mariadb://localhost:3307/empilot
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
